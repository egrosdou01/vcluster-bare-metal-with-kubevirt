apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-vcluster-manual
  namespace: p-default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br0",
      "isDefaultGateway": false,
      "ipam": {}
    }
---
apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: manual-demo
  namespace: p-default
spec:
  template:
    helmRelease:
      chart:
        version: 0.34.0
      values: |
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          endpoint: 192.168.100.3:8443
          advanced:
            kubeVip:
              enabled: true
              interface: net1
              gateway: 192.168.100.1/24
          statefulSet:
            pods:
              annotations:
                k8s.v1.cni.cncf.io/networks: p-default/br0-vcluster-manual
        privateNodes:
          enabled: true
    pro:
      enabled: true
  clusterRef:
    cluster: loft-cluster
    namespace: loft-default-v-manual-demo
    virtualCluster: manual-demo
  owner:
    user: admin
