apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-static
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br0",
      "ipam": {
        "type": "static"
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: bridge-jump-pod
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "br0-static",
          "interface": "net1",
          "ips": ["192.168.100.50/24"]
        }
      ]
spec:
  containers:
  - name: jump
    image: nicolaka/netshoot:latest
    command:
    - sleep
    - infinity
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
  restartPolicy: Always
